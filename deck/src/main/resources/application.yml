spring:
  application:
    name: deck
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 10m
springdoc:
  swagger-ui:
    url: /openapi/deck.yaml
management:
  endpoints:
    web:
      exposure:
        include: health
deck:
  time-factor: 1.0
  nebius:
    base-url: https://api.tokenfactory.nebius.com/v1/
    models:
      - model: Qwen/Qwen3-30B-A3B-Instruct-2507
        context-window: 262144
        input-per-m-tok: 0.10
        cached-input-per-m-tok: 0.10
        output-per-m-tok: 0.30
        # The instance budget: at most this many sessions on this model at once (D106). Omit for unbounded.
        max-leases: 2
        # How the weights are stored, as Nebius's model catalogue (/v1/models?verbose=true) reports it
        quantization: fp8
        bits-per-weight: 8
