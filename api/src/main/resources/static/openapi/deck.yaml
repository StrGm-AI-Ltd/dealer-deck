  schemas:
    Implementation:
      type: string
      description: '`stub`: the simulated local server. `external`: backed by a cloud provider.'
      enum: [stub, external]
    Readiness:
      type: string
      description: >-
        `loaded`: a new lease is ready at once. `unloaded`: a new lease spends the profile's `loadingTimeMs`
        in `loading` first.
      enum: [loaded, unloaded]
    LeaseState:
      type: string
      description: >-
        `loading` until the profile is loaded, then `ready`. `released` (DEALER let it go) and `evicted` are
        final.
      enum: [loading, ready, released, evicted]
      example: ready
    Prices:
      type: object
      description: USD per 1M tokens (0 on the stub)
      properties:
        inputPerMTok:
          type: number
          format: double
          example: 0.1
        cachedInputPerMTok:
          type: number
          format: double
          example: 0.1
        outputPerMTok:
          type: number
          format: double
          example: 0.3
    LeaseReduction:
      type: object
      required: [profileId, leases]
      properties:
        profileId:
          type: string
          description: Another profile on the same server
          example: large
        leases:
          type: integer
          minimum: 1
          description: How many fewer leases `profileId` can grant while one lease on this profile is active
          example: 1
    Limitations:
      type: object
      description: What a lease on this profile costs the server's other profiles
      properties:
        leaseReductions:
          type: array
          description: >-
            The profiles that can grant fewer leases while one lease on this profile is active, e.g. because
            they share its hardware. The leases a profile can still grant are its `maxLeases`, minus its
            `activeLeases`, minus the reductions from active leases on other profiles, and never below zero.
          items:
            $ref: '#/components/schemas/LeaseReduction'
    SpeedPoint:
      type: object
      description: The profile's speeds at one context size
      required: [contextTokens, prefillTokensPerSecond, decodeTokensPerSecond]
      properties:
        contextTokens:
          type: integer
          description: Tokens in the context
          example: 4096
        prefillTokensPerSecond:
          type: number
          format: double
          description: How fast the prompt is processed before the first token
          example: 800
        decodeTokensPerSecond:
          type: number
          format: double
          description: How fast new tokens are generated
          example: 40
    Quantization:
      type: object
      description: >-
        How the model's weights are stored, so DEALER can weigh quality against speed and cost when it plans a
        route. Null on a profile whose server doesn't know it.
      required: [format]
      properties:
        format:
          type: string
          description: >-
            The format's name as the provider or runtime gives it, e.g. `bf16`, `fp8` or `fp4` (Nebius Token
            Factory's names) or `q4_k_m` (a llama.cpp GGUF format)
          example: fp8
        bitsPerWeight:
          type: number
          format: double
          description: >-
            Nominal bits per weight, for comparing formats: e.g. 16 for `bf16`, 8 for `fp8`, 4 for `fp4` or
            `q4_k_m`
          example: 8
    ModelProfile:
      type: object
      required: [id, model, contextWindow, readiness]
      properties:
        id:
          type: string
          example: small-a
        model:
          type: string
          example: stub/small-a
        provider:
          type: string
          description: Set by external servers, e.g. `nebius`; null on the stub
          example: nebius
        contextWindow:
          type: integer
          example: 32768
        quantization:
          $ref: '#/components/schemas/Quantization'
        readiness:
          $ref: '#/components/schemas/Readiness'
        loadingTimeMs:
          type: integer
          description: >-
            How long a lease on this profile spends in `loading` when the profile is `unloaded`. Given whatever
            the current readiness, so DEALER can weigh the cost of coming back to the profile later. Null when
            the profile never needs loading, e.g. on external servers.
          example: 3000
        limitations:
          $ref: '#/components/schemas/Limitations'
        prices:
          $ref: '#/components/schemas/Prices'
        maxLeases:
          type: integer
          description: >-
            The profile's instance budget: how many leases it allows at once. Absent means unbounded.
            External servers can set it per model, e.g. to cap the use of an expensive model (D106).
            Over budget, POST /leases answers 409 with the leases in the way, so DEALER can queue or evict.
          example: 1
        activeLeases:
          type: integer
          description: This profile's leases that are `loading` or `ready`
          example: 0
        speeds:
          type: array
          description: >-
            Prefill and decode speeds at several context sizes, sorted by `contextTokens`. Between two points,
            interpolate linearly. Empty when the server doesn't know them.
          items:
            $ref: '#/components/schemas/SpeedPoint'
          example:
            - contextTokens: 4096
              prefillTokensPerSecond: 800
              decodeTokensPerSecond: 40
            - contextTokens: 16384
              prefillTokensPerSecond: 600
              decodeTokensPerSecond: 34
            - contextTokens: 32768
              prefillTokensPerSecond: 450
              decodeTokensPerSecond: 28
    ModelProfiles:
      type: object
      required: [server, implementation, profiles]
      properties:
        server:
          type: string
          example: stub
        implementation:
          $ref: '#/components/schemas/Implementation'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ModelProfile'
    LeaseRequest:
      type: object
      required: [profileId, sessionRef]
      properties:
        profileId:
          type: string
          example: small-a
        sessionRef:
          type: string
          description: Opaque reference to DEALER's session; DEALER sends `<client>/<session id>`
          example: agent-a/a-1
    Usage:
      type: object
      properties:
        promptTokens:
          type: integer
          format: int64
          example: 10
        cachedTokens:
          type: integer
          format: int64
          example: 0
        completionTokens:
          type: integer
          format: int64
          example: 3
        estimated:
          type: boolean
          description: True if the provider sent no usage and the counts are estimates
          example: false
    Lease:
      type: object
      required: [id, profileId, state]
      properties:
        id:
          type: string
          example: lease-24af55a1
        profileId:
          type: string
          example: small-a
        sessionRef:
          type: string
          description: The `sessionRef` DEALER sent when acquiring the lease
          example: agent-a/a-1
        state:
          $ref: '#/components/schemas/LeaseState'
        createdAtMs:
          type: integer
          format: int64
          description: When the lease was granted, in Unix milliseconds
          example: 1795545070814
        readyAtMs:
          type: integer
          format: int64
          description: When the lease became `ready`, in Unix milliseconds; null while it's `loading`
          example: 1795545070814
        usage:
          $ref: '#/components/schemas/Usage'
    LeaseConflict:
      type: object
      required: [error, blockers]
      properties:
        error:
          $ref: 'common.yaml#/components/schemas/ErrorBody'
        blockers:
          type: array
          description: IDs of the leases that block this one
          items:
            type: string
          example: [lease-24af55a1]
    Worker:
      type: object
      description: A simulated worker (stub only)
      properties:
        id:
          type: string
          example: w1
        loadedProfile:
          type: string
          description: The profile loaded on this worker; `loading <profile>` while one is being loaded
          example: small-a
        state:
          type: string
          description: '`idle`, `leased` or `loading`'
          example: leased
    DeckState:
      type: object
      required: [server, implementation, profiles, leases]
      properties:
        server:
          type: string
          example: stub
        implementation:
          $ref: '#/components/schemas/Implementation'
        provider:
          type: string
          description: Set by external servers, e.g. `nebius`; null on the stub
          example: nebius
        workers:
          type: array
          description: The stub's simulated workers; empty on external servers
          items:
            $ref: '#/components/schemas/Worker'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ModelProfile'
        leases:
          type: array
          description: The 30 most recent leases, in every state
          items:
            $ref: '#/components/schemas/Lease'
        spendUsd:
          type: number
          format: double
          description: What all of this server's leases have cost so far at its profiles' prices, in USD; 0 on the stub
          example: 0.0
