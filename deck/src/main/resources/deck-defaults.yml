# What every DECK server shares. Each server's application.yml imports this file.
spring:
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 10m
deck:
  recent-leases: 30
springdoc:
  swagger-ui:
    url: /openapi/deck.yaml
management:
  endpoints:
    web:
      exposure:
        include: health
