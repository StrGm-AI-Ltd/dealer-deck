openapi: 3.0.3
info:
  title: DEALER API
  version: 0.5.0
  description: >-
    DEALER is the router for agent fleets: one OpenAI-compatible endpoint that routes agent sessions
    across a DECK of local and cloud LLM servers by client priority, availability and cost.
    Agents and OpenAI SDKs use it by changing their base URL. Clients authenticate with their API key.
servers:
  - url: http://localhost:8080
    description: DEALER
security:
  - bearerAuth: []
tags:
  - name: Chat
    description: OpenAI-compatible streaming chat completions
  - name: Models
    description: The models DEALER can route to, including virtual models
  - name: Metrics
    description: Metrics and observability (read by the DEALER UI)
paths:
  /v1/chat/completions:
    post:
      tags: [Chat]
      operationId: createChatCompletion
      summary: OpenAI-compatible streaming chat completion
      description: >-
        Streaming only in v0.5. The request waits in DEALER's queue until it can be placed on a DECK
        profile. A session keeps its lease across requests (sticky) until the lease idles out or is
        evicted by a higher-priority client. A session holds one lease at a time: a request that arrives
        while another request in the session is queued waits for it, and a request for another model
        waits until the session's requests in flight end. The response is a server-sent event stream of
        `ChatCompletionChunk` objects ending with `data: [DONE]`.
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          description: The agent session; scoped to the client
          schema:
            $ref: 'common.yaml#/components/schemas/SessionId'
        - name: X-Request-Priority
          in: header
          required: false
          description: Orders this client's own requests (1–100, default 50). Never evicts.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: The streamed completion. `X-Dealer-Server` and `X-Dealer-Profile` name where it ran.
          headers:
            X-Dealer-Server:
              schema:
                type: string
            X-Dealer-Profile:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: 'common.yaml#/components/schemas/ChatCompletionChunk'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: Every DECK server's profiles plus the virtual models
      responses:
        '200':
          description: OpenAI-style model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Error'
  /metrics/state:
    get:
      tags: [Metrics]
      operationId: getDealerState
      summary: The queue, sessions and leases, evictions, tokens and cost
      responses:
        '200':
          description: The current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerState'
        '401':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A client API key (or the metrics key, for /metrics only)
  responses:
    Error:
      description: OpenAI-style error
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
  schemas:
    ServerType:
      type: string
      description: >-
        The type of a DECK server, set per server by DEALER's operator, not by the server (D94): `local`
        hardware, or an `external` cloud provider. Only clients allowed external routing are placed on
        `external` servers. Null where no DECK server applies, e.g. on virtual models.
      enum: [local, external]
      example: local
    SessionLeaseState:
      type: string
      description: >-
        Where a session's lease stands: `none` before its first lease; `loading` and `ready` while it
        holds one; `evicting` while a higher-priority client waits for its requests in flight to end;
        `evicted`, `released` (for a model switch) or `released_idle` once it no longer holds one.
      enum: [none, loading, ready, evicting, evicted, released, released_idle]
      example: ready
    Model:
      type: object
      description: >-
        A model a client can request: a DECK profile, or a virtual `auto-*` model. `deck_server` is the DECK
        server that serves the profile, and null for virtual models.
      required: [id, object, created, owned_by]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/ModelName'
        object:
          type: string
          example: model
        created:
          type: integer
          format: int64
          description: >-
            Unix seconds: DEALER's start time, since neither virtual models nor DECK profiles have a creation date
            of their own
          example: 1795545071
        owned_by:
          type: string
          example: dealer
        deck_server:
          $ref: 'common.yaml#/components/schemas/ServerName'
        server_type:
          $ref: '#/components/schemas/ServerType'
        context_window:
          type: integer
        virtual:
          type: boolean
          description: True for auto-* models that DEALER places itself
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    ClientInfo:
      type: object
      properties:
        name:
          $ref: 'common.yaml#/components/schemas/ClientName'
        priority:
          type: integer
        external_routing:
          type: boolean
    QueuedRequest:
      type: object
      properties:
        client:
          $ref: 'common.yaml#/components/schemas/ClientName'
        session_id:
          $ref: 'common.yaml#/components/schemas/SessionId'
        model:
          $ref: 'common.yaml#/components/schemas/ModelName'
        client_priority:
          type: integer
        request_priority:
          type: integer
        waiting_ms:
          type: integer
          format: int64
        reserved_profile:
          type: string
          description: A profile being drained for this request, if any
    SessionInfo:
      type: object
      description: >-
        A session DEALER tracks. `deck_server`, `profile_id` and `lease_id` describe the session's lease, and are
        null without one.
      properties:
        client:
          $ref: 'common.yaml#/components/schemas/ClientName'
        session_id:
          $ref: 'common.yaml#/components/schemas/SessionId'
        model:
          $ref: 'common.yaml#/components/schemas/ModelName'
        deck_server:
          $ref: 'common.yaml#/components/schemas/ServerName'
        server_type:
          $ref: '#/components/schemas/ServerType'
        profile_id:
          $ref: 'common.yaml#/components/schemas/ProfileId'
        lease_id:
          $ref: 'common.yaml#/components/schemas/LeaseId'
        lease_state:
          $ref: '#/components/schemas/SessionLeaseState'
        lease_age_ms:
          type: integer
          format: int64
        idle_ms:
          type: integer
          format: int64
        in_flight:
          type: integer
        evict_pending:
          type: boolean
        requests:
          type: integer
        prompt_tokens:
          type: integer
          format: int64
        cached_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
    EvictionEvent:
      type: object
      description: >-
        A lease evicted for a higher-priority client. `deck_server` and `profile_id` say where the victim's lease
        was.
      properties:
        created_at:
          type: integer
          format: int64
          description: When DEALER decided the eviction, in Unix seconds
          example: 1795547093
        victim_client:
          $ref: 'common.yaml#/components/schemas/ClientName'
        victim_session:
          $ref: 'common.yaml#/components/schemas/SessionId'
        deck_server:
          $ref: 'common.yaml#/components/schemas/ServerName'
        profile_id:
          $ref: 'common.yaml#/components/schemas/ProfileId'
        by_client:
          $ref: 'common.yaml#/components/schemas/ClientName'
        reason:
          type: string
    ServerInfo:
      type: object
      properties:
        name:
          $ref: 'common.yaml#/components/schemas/ServerName'
        url:
          type: string
        server_type:
          $ref: '#/components/schemas/ServerType'
        reachable:
          type: boolean
        profiles:
          type: integer
    DealerState:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ClientInfo'
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ServerInfo'
        queue:
          type: array
          items:
            $ref: '#/components/schemas/QueuedRequest'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
        evictions:
          type: array
          items:
            $ref: '#/components/schemas/EvictionEvent'
