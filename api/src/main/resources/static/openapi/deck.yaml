openapi: 3.0.3
info:
  title: DECK API
  version: 0.5.0
  description: >-
    One interface for every DECK server, local or external (D105). A DECK server publishes its
    capacity-aware model profiles and grants leases on them; DEALER routes and evicts
    in profile and lease terms only, without knowing the hardware (D18, D74).
    In v0.5 there are two implementations: the external server backed by Nebius Token Factory, and
    a local stub that simulates two workers. Every endpoint requires DEALER's DECK key (D104).
servers:
  - url: http://localhost:8081
    description: DECK stub
  - url: http://localhost:8082
    description: DECK external (Nebius Token Factory)
security:
  - bearerAuth: []
tags:
  - name: Model profiles
    description: Serving profiles, with their readiness, quantization, limitations and speeds
  - name: Leases
    description: Exclusive use of a profile by one session
  - name: Chat
    description: OpenAI-compatible streaming chat on a leased profile
  - name: Metrics
    description: Observability of this DECK server
paths:
  /model-profiles:
    get:
      tags: [Model profiles]
      operationId: getModelProfiles
      summary: The serving profiles this server offers
      responses:
        '200':
          description: The model profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfiles'
              examples:
                stub:
                  $ref: '#/components/examples/StubModelProfiles'
                external:
                  $ref: '#/components/examples/ExternalModelProfiles'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /leases:
    get:
      tags: [Leases]
      operationId: listLeases
      summary: The active leases, optionally only those on one profile
      description: >-
        For choosing a lease to evict. Lists only `loading` and `ready` leases, oldest first. To free capacity
        for a profile, look at the leases on the profiles whose `limitations.leaseReductions` name it, as well
        as at the leases on the profile itself.
      parameters:
        - name: profileId
          in: query
          required: false
          description: Only the leases on this profile
          schema:
            type: string
          example: small-a
      responses:
        '200':
          description: The active leases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lease'
              example:
                - id: lease-24af55a1
                  profileId: small-a
                  state: ready
                  createdAtMs: 1795545070814
                  readyAtMs: 1795545070814
                  sessionRef: agent-a/a-1
                  usage: {cachedTokens: 0, completionTokens: 0, estimated: false, promptTokens: 0}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnknownProfile'
    post:
      tags: [Leases]
      operationId: acquireLease
      summary: Atomically acquire a lease on a profile for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseRequest'
      responses:
        '201':
          description: The lease. It starts in `loading` if the profile has to be loaded first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
              examples:
                ready:
                  $ref: '#/components/examples/LeaseReady'
                loading:
                  $ref: '#/components/examples/LeaseLoading'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnknownProfile'
        '409':
          description: The profile can't be leased now. `blockers` lists the leases in the way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseConflict'
              examples:
                blocked:
                  $ref: '#/components/examples/LeaseBlocked'
                budget:
                  $ref: '#/components/examples/LeaseBudgetInUse'
  /leases/{leaseId}:
    parameters:
      - $ref: '#/components/parameters/LeaseId'
    get:
      tags: [Leases]
      operationId: getLease
      summary: A lease, with its state and accumulated usage
      responses:
        '200':
          description: The lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
              examples:
                withUsage:
                  $ref: '#/components/examples/LeaseWithUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnknownLease'
    delete:
      tags: [Leases]
      operationId: releaseLease
      summary: Release a lease
      responses:
        '204':
          description: Released
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnknownLease'
  /leases/{leaseId}/evict:
    parameters:
      - $ref: '#/components/parameters/LeaseId'
    post:
      tags: [Leases]
      operationId: evictLease
      summary: Evict a lease (DEALER calls this between requests)
      responses:
        '200':
          description: The evicted lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
              example:
                id: lease-24af55a1
                profileId: small-a
                state: evicted
                createdAtMs: 1795545070814
                readyAtMs: 1795545070814
                sessionRef: agent-a/a-1
                usage: {cachedTokens: 0, completionTokens: 3, estimated: false, promptTokens: 10}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnknownLease'
  /v1/chat/completions:
    post:
      tags: [Chat]
      operationId: createChatCompletion
      summary: OpenAI-compatible streaming chat completion on a leased profile
      description: >-
        Streaming only. The response is a server-sent event stream of `ChatCompletionChunk`
        objects ending with `data: [DONE]`. The leased profile decides the model: the stub ignores the
        request's `model`, and an external server replaces it with the profile's model. An external server
        forwards `X-Provider-Authorization` to its provider as `Authorization`; in v0.5 DECK stores no
        provider credentials (D104).
      parameters:
        - name: X-Lease-Id
          in: header
          required: true
          schema:
            type: string
          example: lease-24af55a1
        - name: X-Provider-Authorization
          in: header
          required: false
          description: The provider credential, e.g. `Bearer <Nebius key>`. Required by external servers.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/ChatCompletionRequest'
            example:
              model: small-a
              stream: true
              max_tokens: 3
              stream_options:
                include_usage: true
              messages:
                - role: user
                  content: Explain virtual threads in one paragraph.
      responses:
        '200':
          description: The streamed completion. With `stream_options.include_usage`, the last chunk carries `usage`.
          content:
            text/event-stream:
              schema:
                $ref: 'common.yaml#/components/schemas/ChatCompletionChunk'
              example: |
                data: {"id":"chatcmpl-lease-24af55a1","object":"chat.completion.chunk","created":1795545071,"model":"stub/small-a","choices":[{"index":0,"delta":{"role":"assistant","content":"Here "},"finish_reason":null}]}

                data: {"id":"chatcmpl-lease-24af55a1","object":"chat.completion.chunk","created":1795545071,"model":"stub/small-a","choices":[{"index":0,"delta":{"content":"is "},"finish_reason":null}]}

                data: {"id":"chatcmpl-lease-24af55a1","object":"chat.completion.chunk","created":1795545071,"model":"stub/small-a","choices":[{"index":0,"delta":{"content":"a "},"finish_reason":null}]}

                data: {"id":"chatcmpl-lease-24af55a1","object":"chat.completion.chunk","created":1795545071,"model":"stub/small-a","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}

                data: {"id":"chatcmpl-lease-24af55a1","object":"chat.completion.chunk","created":1795545071,"model":"stub/small-a","choices":[],"usage":{"prompt_tokens":10,"completion_tokens":3,"total_tokens":13,"prompt_tokens_details":{"cached_tokens":0}}}

                data: [DONE]
        '400':
          description: An invalid request, or one the provider rejected
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
              examples:
                streamingOnly:
                  $ref: '#/components/examples/StreamingOnly'
                missingLease:
                  $ref: '#/components/examples/MissingLeaseHeader'
        '401':
          description: >-
            Missing or invalid DECK key, or (external servers) a missing provider credential or one the provider
            rejected, in which case the provider's own error body is passed through
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
              examples:
                deckKey:
                  $ref: '#/components/examples/MissingDeckKey'
                providerCredential:
                  $ref: '#/components/examples/MissingProviderCredential'
        '404':
          $ref: '#/components/responses/UnknownLease'
        '409':
          description: The lease is no longer active
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
              example:
                error: {message: Lease lease-24af55a1 is evicted, type: lease_inactive, code: null, param: null}
        '429':
          description: >-
            The provider's rate limit (external servers). The provider's own error body is passed through; this
            is the body DECK sends when the provider sent none.
          headers:
            Retry-After:
              description: Passed through from the provider when it sends one
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
              example:
                error: {message: Nebius Token Factory error 429, type: upstream_error}
        '502':
          description: The provider's error response couldn't be read (external servers)
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
              example:
                error: {message: Nebius Token Factory error 500, type: upstream_error, code: null, param: null}
        '503':
          description: >-
            Any other provider error (external servers). The provider's own error body is passed through; this
            is the body DECK sends when the provider sent none.
          headers:
            Retry-After:
              description: Passed through from the provider when it sends one
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
              example:
                error: {message: Nebius Token Factory error 500, type: upstream_error}
        '504':
          description: The provider couldn't be reached (external servers)
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
              example:
                error: {message: 'Nebius Token Factory unreachable: request timed out', type: upstream_error, code: null, param: null}
  /metrics/state:
    get:
      tags: [Metrics]
      operationId: getDeckState
      summary: This server's configuration, leases and spend
      responses:
        '200':
          description: The current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckState'
              examples:
                stub:
                  $ref: '#/components/examples/StubState'
                external:
                  $ref: '#/components/examples/ExternalState'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: DEALER's key for this DECK server
  parameters:
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
      example: lease-24af55a1
  responses:
    Unauthorized:
      description: Missing or invalid DECK key
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
          examples:
            deckKey:
              $ref: '#/components/examples/MissingDeckKey'
    UnknownProfile:
      description: Unknown profile
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
          example:
            error: {message: 'Unknown profile: huge', type: not_found, code: null, param: null}
    UnknownLease:
      description: Unknown lease
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
          example:
            error: {message: 'Unknown lease: lease-00000000', type: not_found, code: null, param: null}
  examples:
    LeaseBlocked:
      summary: Stub, the hardware is in use
      value:
        error: {message: Profile large is blocked by active leases, type: lease_conflict, code: null, param: null}
        blockers: [lease-24af55a1]
    LeaseBudgetInUse:
      summary: External, the instance budget is in use
      value:
        error:
          message: The instance budget of nebius/Qwen/Qwen3-30B-A3B-Instruct-2507 (2) is in use
          type: lease_conflict
          code: null
          param: null
        blockers: [lease-5b292842, lease-0c1d7e93]
    StreamingOnly:
      summary: '"stream" is not true'
      value:
        error: {message: 'Streaming only: set "stream": true', type: invalid_request_error, code: null, param: null}
    MissingLeaseHeader:
      summary: No X-Lease-Id header
      value:
        error: {message: Missing required header X-Lease-Id, type: invalid_request_error, code: null, param: null}
    MissingProviderCredential:
      summary: External server, no X-Provider-Authorization
      value:
        error:
          message: >-
            Missing X-Provider-Authorization: this DECK server forwards the provider credential it receives
            (D104)
          type: authentication_error
          code: null
          param: null
    MissingDeckKey:
      summary: No or wrong DECK key
      value:
        error: {message: Missing or invalid DECK key, type: authentication_error}
    LeaseReady:
      summary: On a loaded profile
      value:
        id: lease-24af55a1
        profileId: small-a
        state: ready
        createdAtMs: 1795545070814
        readyAtMs: 1795545070814
        sessionRef: agent-a/a-1
        usage: {cachedTokens: 0, completionTokens: 0, estimated: false, promptTokens: 0}
    LeaseLoading:
      summary: On an unloaded profile
      value:
        id: lease-4db196a3
        profileId: large
        state: loading
        createdAtMs: 1795545368951
        readyAtMs: null
        sessionRef: vip/vip-1
        usage: {cachedTokens: 0, completionTokens: 0, estimated: false, promptTokens: 0}
    LeaseWithUsage:
      summary: After one request
      value:
        id: lease-24af55a1
        profileId: small-a
        state: ready
        createdAtMs: 1795545070814
        readyAtMs: 1795545070814
        sessionRef: agent-a/a-1
        usage: {cachedTokens: 0, completionTokens: 3, estimated: false, promptTokens: 10}
    StubModelProfiles:
