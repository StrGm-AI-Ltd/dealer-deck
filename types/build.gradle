plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

// Microtypes: the identifiers and names DECK and DEALER exchange, each with its own type. The OpenAPI documents
// declare them as named string schemas, and the generated code uses these classes for them (api/build.gradle).
// Also small utilities both share (ai.strgm.util).
dependencies {
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'org.jspecify:jspecify'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
