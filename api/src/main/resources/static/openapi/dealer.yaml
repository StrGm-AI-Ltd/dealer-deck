openapi: 3.0.3
info:
  title: DEALER API
  version: 0.5.0
  description: >-
    DEALER is the router for agent fleets: one OpenAI-compatible endpoint that routes agent sessions
    across a DECK of local and cloud LLM servers by client priority, availability and cost.
    Agents and OpenAI SDKs use it by changing their base URL. Clients authenticate with their API key.
servers:
  - url: http://localhost:8080
    description: DEALER
security:
  - bearerAuth: []
tags:
  - name: Chat
    description: OpenAI-compatible streaming chat completions
  - name: Models
    description: The models DEALER can route to, including virtual models
  - name: Metrics
    description: Metrics and observability (read by the DEALER UI)
paths:
  /v1/chat/completions:
    post:
      tags: [Chat]
      operationId: createChatCompletion
      summary: OpenAI-compatible streaming chat completion
      description: >-
        Streaming only in v0.5. The request waits in DEALER's queue until it can be placed on a DECK
        profile. A session keeps its lease across requests (sticky) until the lease idles out or is
        evicted by a higher-priority client. The response is a server-sent event stream of
        `ChatCompletionChunk` objects ending with `data: [DONE]`.
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          description: The agent session; scoped to the client
          schema:
            type: string
        - name: X-Request-Priority
          in: header
          required: false
          description: Orders this client's own requests (1–100, default 50). Never evicts.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: The streamed completion. `X-Dealer-Server` and `X-Dealer-Profile` name where it ran.
          headers:
            X-Dealer-Server:
              schema:
                type: string
            X-Dealer-Profile:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: 'common.yaml#/components/schemas/ChatCompletionChunk'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: Every DECK server's profiles plus the virtual models
      responses:
        '200':
          description: OpenAI-style model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Error'
  /metrics/state:
    get:
      tags: [Metrics]
      operationId: getDealerState
      summary: The queue, sessions and leases, evictions, tokens and cost
      responses:
        '200':
          description: The current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerState'
        '401':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A client API key (or the metrics key, for /metrics only)
  responses:
    Error:
      description: OpenAI-style error
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
  schemas:
    ServerType:
      type: string
      description: >-
        The type of a DECK server, set per server by DEALER's operator, not by the server (D94): `local`
        hardware, or an `external` cloud provider. Only clients allowed external routing are placed on
        `external` servers. Null where no DECK server applies, e.g. on virtual models.
      enum: [local, external]
      example: local
    Model:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          example: auto-32k
        object:
          type: string
          example: model
        created:
          type: integer
          format: int64
          description: >-
            Unix seconds: DEALER's start time, since neither virtual models nor DECK profiles have a creation date
            of their own
          example: 1795545071
        owned_by:
          type: string
          example: dealer
        deck_server:
          type: string
          description: The DECK server that serves this profile; null for virtual models
          example: stub
        server_type:
          $ref: '#/components/schemas/ServerType'
        context_window:
          type: integer
        virtual:
          type: boolean
          description: True for auto-* models that DEALER places itself
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    ClientInfo:
      type: object
      properties:
        name:
          type: string
        priority:
          type: integer
        external_routing:
          type: boolean
    QueuedRequest:
      type: object
      properties:
        client:
          type: string
        session_id:
          type: string
        model:
          type: string
        client_priority:
          type: integer
        request_priority:
          type: integer
        waiting_ms:
          type: integer
          format: int64
        reserved_profile:
          type: string
          description: A profile being drained for this request, if any
    SessionInfo:
      type: object
      properties:
        client:
          type: string
        session_id:
          type: string
        model:
          type: string
        deck_server:
          type: string
          description: The DECK server the session's lease is on; null without a lease
          example: stub
        server_type:
          $ref: '#/components/schemas/ServerType'
        profile_id:
          type: string
        lease_id:
          type: string
        lease_state:
          type: string
        lease_age_ms:
          type: integer
          format: int64
        idle_ms:
          type: integer
          format: int64
        in_flight:
          type: integer
        evict_pending:
          type: boolean
        requests:
          type: integer
        prompt_tokens:
          type: integer
          format: int64
        cached_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
    EvictionEvent:
      type: object
      properties:
        created_at:
          type: integer
          format: int64
          description: When DEALER decided the eviction, in Unix seconds
          example: 1795547093
        victim_client:
          type: string
        victim_session:
          type: string
        deck_server:
          type: string
          description: The DECK server the victim's lease was on
          example: stub
        profile_id:
          type: string
        by_client:
          type: string
        reason:
          type: string
    ServerInfo:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        server_type:
          $ref: '#/components/schemas/ServerType'
        reachable:
          type: boolean
        profiles:
          type: integer
    DealerState:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ClientInfo'
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ServerInfo'
        queue:
          type: array
          items:
            $ref: '#/components/schemas/QueuedRequest'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
        evictions:
          type: array
          items:
            $ref: '#/components/schemas/EvictionEvent'
