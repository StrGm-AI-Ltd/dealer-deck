openapi: 3.0.3
info:
  title: Shared OpenAI-compatible schemas for DEALER and DECK
  version: 0.5.0
  description: >-
    The subset of the OpenAI chat completions API that DEALER and DECK use. Both API documents
    reference these schemas, so they are defined once (D102).
paths: {}
components:
  schemas:
    LeaseId:
      type: string
      description: A lease's id, as DECK grants it
      example: lease-24af55a1
    ProfileId:
      type: string
      description: A model profile's id, unique on its DECK server
      example: small-a
    SessionRef:
      type: string
      description: >-
        The session a DECK lease is for, as `POST /leases` received it. Opaque to DECK; DEALER sends
        `<client>/<session id>`.
      example: agent-a/a-1
    SessionId:
      type: string
      description: An agent session's id, as a client sends it in `X-Session-Id`; unique within the client
      minLength: 1
      maxLength: 200
      example: a-1
    ModelName:
      type: string
      description: >-
        The `model` a chat request names, as in OpenAI's API: a profile, a provider's model, or a virtual
        `auto-*` model
      example: auto-32k
    ClientName:
      type: string
      description: A DEALER client's name, from DEALER's configuration
      example: agent-a
    ServerName:
      type: string
      description: A DECK server's name
      example: stub
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          example: user
        content:
          type: string
          example: Explain virtual threads in one paragraph.
    StreamOptions:
      type: object
      properties:
        include_usage:
          type: boolean
          example: true
    ChatCompletionRequest:
      type: object
      description: >-
        OpenAI-compatible chat completion request. Streaming only in v0.5 (`stream` must be true).
        Fields not listed here are accepted and passed through to the provider.
      required: [model, messages, stream]
      additionalProperties: true
      properties:
        model:
          $ref: '#/components/schemas/ModelName'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          example: true
        stream_options:
          $ref: '#/components/schemas/StreamOptions'
        max_tokens:
          type: integer
          example: 150
        temperature:
          type: number
          format: double
          example: 0.2
    ChunkDelta:
      type: object
      properties:
        role:
          type: string
          description: Only in the first chunk
          example: assistant
        content:
          type: string
          example: 'Here '
    ChunkChoice:
      type: object
      properties:
        index:
          type: integer
          example: 0
        delta:
          $ref: '#/components/schemas/ChunkDelta'
        finish_reason:
          type: string
          nullable: true
          description: Null until the last chunk of the answer, then `stop`
          example: stop
    PromptTokensDetails:
      type: object
      properties:
        cached_tokens:
          type: integer
          example: 0
    ChunkUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          example: 10
        completion_tokens:
          type: integer
          example: 3
        total_tokens:
          type: integer
          example: 13
        prompt_tokens_details:
          $ref: '#/components/schemas/PromptTokensDetails'
    ChatCompletionChunk:
      type: object
      description: >-
        One server-sent event (`data: {...}`) of a streamed completion. The stream ends with
        `data: [DONE]`. With `stream_options.include_usage`, the last chunk carries `usage`.
      properties:
        id:
          type: string
          example: chatcmpl-lease-24af55a1
        object:
          type: string
          example: chat.completion.chunk
        created:
          type: integer
          format: int64
          description: Unix seconds
          example: 1795545071
        model:
          $ref: '#/components/schemas/ModelName'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChunkChoice'
        usage:
          $ref: '#/components/schemas/ChunkUsage'
    ErrorBody:
      type: object
      required: [message, type]
      properties:
        message:
          type: string
          example: 'Streaming only: set "stream": true'
        type:
          type: string
          example: invalid_request_error
        code:
          type: string
          nullable: true
        param:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      description: OpenAI-style error body.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
